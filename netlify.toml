# Netlify Deployment Configuration for CrimeLens Monorepo

[build]
  base = "dashboard"
  command = "npm run build"
  publish = "dist"

# Build environment variables
# VITE_API_BASE_URL is a public API endpoint baked into the client bundle by Vite design.
# SECRETS_SCAN_OMIT_KEYS tells Netlify's scanner not to flag it as a leaked secret.
[build.environment]
  VITE_API_BASE_URL = "https://datathon-ziw6.onrender.com"
  SECRETS_SCAN_OMIT_KEYS = "VITE_API_BASE_URL"

# SPA Single Page Application Client Routing Redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
