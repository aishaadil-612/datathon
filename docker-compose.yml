version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: argus_postgres
    environment:
      POSTGRES_USER: argus_user
      POSTGRES_PASSWORD: argus_secure_password
      POSTGRES_DB: argus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.15-community
    container_name: argus_neo4j
    environment:
      NEO4J_AUTH: neo4j/argus_graph_password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  neo4j_data:
